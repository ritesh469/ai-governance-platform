server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "governance.demo"
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    ca_ttl = "168h"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    # x509pop node attestation. This replaced join_token, which is
    # single-use: once the agent's SVID expired it could not re-attest, so
    # the agent shut itself down and the whole stack died roughly hourly.
    # See identity/spire/setup-entrypoint.sh for the full write-up.
    #
    # The CA bundle here is generated by the spire-setup container on every
    # bootstrap and shared through the spire-shared volume.
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/opt/spire/conf/server/shared/certs/node-ca.crt"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }
}
